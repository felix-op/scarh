services:
  nginx:
    image: nginx:alpine
    container_name: scarh_nginx_staging
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.scarh_frontend.rule=Host(`api.scarh.online`) || Host(`scarh.online`)
      - traefik.http.routers.scarh_frontend.entrypoints=websecure
      - traefik.http.routers.scarh_frontend.tls.certresolver=letsencrypt
      - traefik.http.services.scarh_frontend.loadbalancer.server.port=80
      # Endpoint heredado de limnígrafos: la única excepción sin TLS.
      - traefik.http.routers.scarh_save_http.rule=Host(`api.scarh.online`) && Path(`/save-get.php`)
      - traefik.http.routers.scarh_save_http.entrypoints=web
      - traefik.http.routers.scarh_save_http.service=scarh_frontend
      # Cualquier otra petición HTTP se redirige a HTTPS.
      - traefik.http.routers.scarh_http_redirect.rule=(Host(`api.scarh.online`) || Host(`scarh.online`)) && !Path(`/save-get.php`)
      - traefik.http.routers.scarh_http_redirect.entrypoints=web
      - traefik.http.routers.scarh_http_redirect.middlewares=scarh_https_redirect
      - traefik.http.routers.scarh_http_redirect.service=noop@internal
      - traefik.http.middlewares.scarh_https_redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.scarh_https_redirect.redirectscheme.permanent=true
      - traefik.docker.network=red_prueba
    networks:
      - red_prueba

volumes:
  static_volume:
  media_volume:

networks:
  red_prueba:
    external: true
